<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0F1216" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="100%" stop-color="#E5820D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container with subtle CS/gaming chamfer -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad1)" stroke="#2D3748" stroke-width="2.5"/>

  <!-- Chat Bubble 1 (CS2 Orange / T side / Outgoing translation) -->
  <g filter="url(#glow)">
    <path d="M30 42 C30 33 37 26 48 26 L80 26 C91 26 98 33 98 42 L98 62 C98 71 91 78 80 78 L46 78 L32 90 L34 76 C31 73 30 68 30 62 Z" 
          fill="url(#orangeGrad)"/>
    <!-- Crosshair Target inside main bubble -->
    <circle cx="64" cy="52" r="14" fill="none" stroke="#11161D" stroke-width="3.5" stroke-dasharray="16 6"/>
    <circle cx="64" cy="52" r="3" fill="#11161D"/>
    <line x1="64" y1="34" x2="64" y2="40" stroke="#11161D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="64" y2="70" stroke="#11161D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="46" y1="52" x2="52" y2="52" stroke="#11161D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="76" y1="52" x2="82" y2="52" stroke="#11161D" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Sub Chat Bubble (CT Cyan / Global translation icon '文' or arrows) -->
  <g filter="url(#glow)">
    <path d="M68 66 C68 59 74 54 82 54 L98 54 C106 54 112 59 112 66 L112 80 C112 87 106 92 98 92 L94 92 L88 99 L89 91 C85 89 82 85 82 80 Z" 
          fill="url(#cyanGrad)" stroke="#11161D" stroke-width="2.5"/>
    <!-- Translation sync / swap arrows -->
    <path d="M89 71 L103 71 M99 67 L103 71 L99 75" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M103 78 L89 78 M93 74 L89 78 L93 82" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>